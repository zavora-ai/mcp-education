[workspace]

[package]
name = "mcp-education"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Education LMS MCP server — courses, assignments, grades, students, announcements via Canvas LMS and generic LMS APIs"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-education"
keywords = ["mcp", "education", "lms", "canvas", "courses"]
categories = ["api-bindings"]

[features]
default = ["canvas"]
canvas = []

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
